name: Canary (live YouTube)

# Real downloads against YouTube every night, so breakage is noticed before users report it.
# GitHub-hosted runners use datacenter IPs that YouTube often bot-checks; set the optional
# TUBEPULL_CANARY_COOKIES secret (a Netscape cookies.txt) or use a self-hosted runner for stable results.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      HAS_COOKIES: ${{ secrets.TUBEPULL_CANARY_COOKIES != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write cookies
        if: env.HAS_COOKIES == 'true'
        env:
          COOKIES: ${{ secrets.TUBEPULL_CANARY_COOKIES }}
        run: printf '%s' "$COOKIES" > "$RUNNER_TEMP/cookies.txt" && echo "TUBEPULL_CANARY_COOKIES=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
      - run: npm run test:canary
      - name: Doctor output
        if: failure()
        run: npm run build && node dist/cli.js doctor || true
      - name: Open an issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Canary failed: live YouTube downloads are broken';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'canary',
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number,
                body: `Still failing: ${run}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, labels: ['canary'],
                body: `The nightly canary failed: ${run}\n\nCheck for youtubei.js updates first.`,
              });
            }
